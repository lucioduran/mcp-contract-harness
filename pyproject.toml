[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-contract-harness"
version = "0.1.0"
description = "Read-only MCP server and reproducible stdio interoperability contracts"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
mcp-contract-server = "mcp_contract.server:main"

[tool.setuptools.packages.find]
include = ["mcp_contract*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mcp_contract"]
